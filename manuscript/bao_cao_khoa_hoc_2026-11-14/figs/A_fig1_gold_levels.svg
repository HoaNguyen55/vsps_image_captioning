<svg xmlns="http://www.w3.org/2000/svg" width="640" height="210" viewBox="0 0 640 210" font-family="Helvetica, Arial, sans-serif" font-size="11">
<rect width="640" height="210" fill="white"/>
<text x="320.0" y="22.0" text-anchor="middle" font-size="12" >Gold levels scored against one fixed set of matched mentions</text>
<rect x="40" y="60" width="130" height="50" fill="#eee" stroke="#222"/>
<text x="105.0" y="90.0" text-anchor="middle" font-size="11" >1 reference</text>
<rect x="190" y="60" width="130" height="50" fill="#eee" stroke="#222"/>
<text x="255.0" y="90.0" text-anchor="middle" font-size="11" >k references</text>
<text x="180.0" y="90.0" text-anchor="middle" font-size="16" >⊂</text>
<rect x="340" y="60" width="130" height="50" fill="#eee" stroke="#222"/>
<text x="405.0" y="90.0" text-anchor="middle" font-size="11" >all references</text>
<text x="330.0" y="90.0" text-anchor="middle" font-size="16" >⊂</text>
<rect x="490" y="60" width="130" height="50" fill="white" stroke="#222" stroke-dasharray="5 3"/>
<text x="555.0" y="82.0" text-anchor="middle" font-size="11" >label gold</text>
<text x="555.0" y="98.0" text-anchor="middle" font-size="9" >(instance or verified)</text>
<text x="205.0" y="140.0" text-anchor="middle" font-size="10" >nested: ordered even if objects go missing at random</text>
<text x="555.0" y="140.0" text-anchor="middle" font-size="10" >not nested: the informative step</text>
<text x="320.0" y="185.0" text-anchor="middle" font-size="10" >verbosity slope = slope of F1 on ln M across the systems of a family, under each gold</text>
</svg>
